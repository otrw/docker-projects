services:
  audiobookshelf:
    container_name: abs
    image: ghcr.io/advplyr/audiobookshelf:2.36.0
    # ABS runs on port 13378 by default. If you want to change
    # the port, only change the external port
    #ports:
    #  - 13378:80
    # Managed by Nginx Proxy Manager, so no need to expose the port.
    volumes:
      # These volumes are needed to keep your library persistent
      # and allow media to be accessed by the ABS server.
      - ./config:/config
      - ./metadata:/metadata
      # Access to the audiobooks already downloaded by Libation. The default is ./audiobooks:/audiobooks.
      - libation_books:/audiobooks:ro
      - ./podcasts:/podcasts
    environment:
      - TZ=Europe/London
    restart: unless-stopped
    networks:
      - npmnet

volumes:
  libation_books:
    name: libation_books
    external: true

networks:
  npmnet:
    external: true
    